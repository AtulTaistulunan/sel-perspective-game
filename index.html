<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>換個位置看看</title>
<!-- 字體：jf open 粉圓（Huninn，開源授權），由 Google Fonts 載入；沒有網路時會改用系統字體 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3b2f2a; --soft:#7a6a5c; --paper:#fff8ea; --wood:#8a5a3b; --wood2:#b98557;
  --ming:#4f8fd9; --hua:#3fae8c; --accent:#f2a33a; --good:#3fae6a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2b2230;overflow:hidden}
body{font-family:"Huninn","Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none}
#stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;background:#000;
  font-size:min(2.25vw,4vh)}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;transition:filter .8s}
#stage.memory canvas{filter:sepia(.75) saturate(.8) brightness(1.05)}
#stage.memory::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 6em rgba(80,50,20,.55)}
#stage.memory::before{content:"回憶中";position:absolute;top:2%;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;
  background:rgba(92,58,34,.85);color:#fff3dc;padding:.15em 1em;border-radius:2em;font-size:.85em;letter-spacing:.15em}

/* 上方資訊列 */
#top{position:absolute;left:1.5%;top:2%;right:1.5%;display:flex;gap:.6em;align-items:flex-start;pointer-events:none;z-index:5}
.tagbox{white-space:nowrap;background:rgba(255,248,234,.94);border:.18em solid var(--wood);border-radius:.7em;padding:.2em .7em;font-weight:400;box-shadow:0 .2em 0 rgba(0,0,0,.25)}
b,strong,h1,h2,h3{font-weight:400}
#stageName{font-size:.9em}
#stageName:empty,#stars:empty{display:none}
/* 善意星星收集動畫 */
#stars.pulse{animation:spulse .6s ease}
@keyframes spulse{40%{transform:scale(1.25);background:#fff3c4}}
.flystar{position:absolute;z-index:40;display:flex;flex-direction:column;align-items:center;pointer-events:none;
  transform:translate(-50%,-50%) scale(.2);opacity:0;transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.flystar .big{font-size:5.5em;line-height:1;filter:drop-shadow(0 0 .25em rgba(255,214,90,.9))}
.flystar .big .ico{width:1.2em;height:1.2em}
.flystar .cap{margin-top:.2em;background:var(--accent);color:#fff;border:.15em solid #c47f22;border-radius:2em;padding:.1em 1em;font-size:1.2em;white-space:nowrap}
.flystar.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.flystar.fly{transition:left .7s ease-in,top .7s ease-in,transform .7s ease-in,opacity .7s ease-in}
.spark{position:absolute;z-index:39;width:.5em;height:.5em;border-radius:50%;background:#ffd84a;pointer-events:none;transition:transform .6s ease-out,opacity .6s ease-out}
#mute{pointer-events:auto;margin-left:auto;cursor:pointer;font-size:1em}
#hud{display:none;gap:.5em;align-items:center;font-size:.85em}
#stage.hudon #stageName{font-size:.8em}
#hud.on{display:flex}
.meter{display:flex;align-items:center;gap:.3em;font-size:.8em}
.bars{display:flex;gap:.12em}
.bars i{width:.55em;height:1em;border-radius:.15em;background:#e7ddc9;transition:background .4s}
#hearts{display:inline-flex;gap:.1em;align-items:center}
.hrt{color:#e2574c;font-size:1.05em;line-height:1}
.hrt.off{color:#d9cbb0}
/* AI 生成的像素圖示（遊戲素材/sprites/圖示.png，4 x 4） */
.ico{display:inline-block;width:1.2em;height:1.2em;background-size:400% 400%;background-repeat:no-repeat;image-rendering:pixelated;vertical-align:-.2em}
.badge{display:inline-block;padding:0 .35em;border-radius:.4em;background:#e7ddc9;color:#b5a58e;margin-left:.15em;font-size:.85em;transition:all .4s}
.badge.on{background:var(--accent);color:#fff}

/* 提示橫幅 */
#hint::before{content:"";display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--accent);margin-right:.5em;vertical-align:.05em;box-shadow:0 0 0 .2em rgba(242,163,58,.35)}
#hint{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);background:rgba(59,47,42,.88);color:#fff;
  padding:.4em 1.1em;border-radius:2em;font-size:.95em;font-weight:400;display:none;z-index:5;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-.25em)}}

/* 大頭像 */
.portrait{position:absolute;bottom:0;width:28%;height:70%;display:none;z-index:6;transition:filter .25s,transform .25s;pointer-events:none}
.portrait.on{display:block}
.portrait.dim{filter:brightness(.55) saturate(.6);transform:translateY(3%)}
#pl{left:-1.5%}
#pr{right:-1.5%}
.portrait img{position:absolute;bottom:0;width:100%;height:100%;object-fit:contain;object-position:bottom}
.ph{position:absolute;bottom:4%;left:12%;right:12%;height:72%;border-radius:1em 1em .6em .6em;border:.25em solid;
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 .3em 0 rgba(0,0,0,.3)}
.ph .e{font-size:4.6em;line-height:1}
.ph .n{font-weight:400;color:#fff;padding:.05em .7em;border-radius:.6em;margin-top:.3em}

/* 對話框 */
#dlg{position:absolute;left:24%;right:24%;bottom:3%;min-height:24%;background:var(--paper);border:.25em solid var(--wood);
  border-radius:1.2em;padding:.9em 1.2em 1em;box-shadow:0 .35em 0 rgba(0,0,0,.35);display:none;z-index:7;font-size:1.05em;line-height:1.5;cursor:pointer}
#dlg.asking{padding:.8em 1em .7em}
#dlg.on{display:block}
#dlg.narr{background:#ece6dc;color:#6b5f55;border-style:dashed}
#name{position:absolute;top:-1.15em;left:1em;background:var(--wood2);color:#fff;font-weight:400;padding:.05em .8em;border-radius:.6em;border:.15em solid var(--wood);font-size:.9em}
#more{position:absolute;right:.8em;bottom:.2em;font-size:.8em;color:var(--wood);animation:bob2 .8s infinite}
@keyframes bob2{50%{transform:translateY(.2em)}}

/* 選單 */
#menu{display:none}
#opts{display:flex;flex-direction:column;gap:.3em;margin-top:.4em}
#opts:empty{display:none}
.opt{background:#fff;border:.18em solid #d9c3a0;border-radius:.7em;padding:.25em .7em;font-size:.82em;text-align:left;cursor:pointer;
  font-family:inherit;color:var(--ink);box-shadow:0 .15em 0 #d9c3a0;animation:slide .25s ease both;line-height:1.45}
.opt:hover,.opt:active{background:#fff1d6;border-color:var(--accent)}
.opt b{color:var(--accent);margin-right:.3em}
@keyframes slide{from{transform:translateY(.5em);opacity:0}}

/* 面板（任務、反思、摘要） */
#sheet{position:absolute;inset:6% 8% 5%;background:var(--paper);border:.3em solid var(--wood);border-radius:1.3em;
  box-shadow:0 .4em 0 rgba(0,0,0,.35);padding:1em 1.4em;display:none;z-index:9;overflow:auto;animation:pop .3s}
#sheet.on{display:block}
@keyframes pop{from{transform:scale(.94);opacity:0}}
#sheet h2{margin:.1em 0 .5em;font-size:1.3em}
.ribbon{display:inline-block;background:var(--wood2);color:#fff;border-radius:.5em;padding:0 .7em;font-size:.8em;font-weight:400;margin-bottom:.3em}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:.5em}
.card{border:.2em solid #e2d5bd;background:#fff;border-radius:.8em;padding:.5em .2em;text-align:center;cursor:pointer;font-family:inherit;font-size:.95em;font-weight:400;color:var(--ink)}
.card b{display:flex;align-items:center;justify-content:center;height:2.6em}
.card b .ico{width:2.6em;height:2.6em}
.card b:empty{display:none}
.card{min-height:3.4em;font-size:1.05em}
.card .dot{display:block;width:.7em;height:.7em;border-radius:50%;margin:0 auto .3em}
.card.on{border-color:var(--accent);background:#fff1d6;transform:translateY(-.2em)}
.row{display:flex;gap:.7em;justify-content:center;flex-wrap:wrap;margin-top:.8em}
.btn{border:none;border-radius:.8em;padding:.45em 1.4em;font-size:1.05em;font-weight:400;background:var(--accent);color:#fff;
  box-shadow:0 .22em 0 #c47f22;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(.15em);box-shadow:0 .07em 0 #c47f22}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 .22em 0 #d9cbb0;border:.15em solid #d9cbb0}
.choice{display:block;width:100%;text-align:left;border:.2em solid #e2d5bd;background:#fff;border-radius:.8em;padding:.5em .8em;margin-top:.5em;
  font-size:1em;cursor:pointer;font-family:inherit;color:var(--ink)}
.choice.on{border-color:var(--accent);background:#fff1d6}
/* 心情溫度計 */
.tmwrap{display:flex;align-items:center;justify-content:center;gap:1.8em;margin-top:.3em}
.tmface{width:9.5em;height:9.5em;border-radius:1em;background:linear-gradient(#fff6e4,#f3e2c4);border:.2em solid #e2d5bd;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.tmface img{width:112%;margin-bottom:-6%}
.tmface .e{font-size:5em;line-height:1.6}
.tm{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.tube{position:relative;width:1.7em;height:11em;background:repeating-linear-gradient(to top,#fff 0 calc(20% - .12em),#eadfca calc(20% - .12em) 20%);
  border:.22em solid var(--wood);border-bottom:none;border-radius:1em 1em 0 0;overflow:hidden}
.fill{position:absolute;left:0;right:0;bottom:0;height:0;transition:height .35s,background .35s;opacity:.92}
.bulb{width:3.2em;height:3.2em;border-radius:50%;border:.22em solid var(--wood);margin-top:-.5em;background:#e7ddc9;transition:background .35s;box-shadow:inset -.3em -.3em 0 rgba(0,0,0,.12)}
.tmlabels{display:flex;flex-direction:column;gap:.35em}
.tml{display:flex;align-items:center;gap:.5em;border:.18em solid #e2d5bd;background:#fff;border-radius:.7em;padding:.2em .8em;cursor:pointer;font-family:inherit;font-size:.95em;color:var(--ink);text-align:left}
.tml i{width:.8em;height:.8em;border-radius:50%;flex:none}
.tml.on{border-color:var(--accent);background:#fff1d6}
.aha{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
.aha .col{border-radius:.9em;padding:.45em .7em;line-height:1.45;font-size:.88em;display:flex;gap:.7em;align-items:center}
.ahaimg{width:5.2em;height:5.2em;flex:none;border-radius:.8em;background:#fff;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.ahaimg img{width:115%}
.ahaimg .e{font-size:3.5em}
.pill{display:inline-block;background:#fff;border-radius:.6em;padding:0 .5em;margin:.1em;font-weight:400}
.understand{text-align:center;color:var(--wood);font-size:.92em;margin-bottom:.2em}
.needhint{background:#f4f8ff;border:.15em dashed #a9c4e6;border-radius:.8em;padding:.5em .8em;margin-bottom:.6em;font-size:.88em}
.needhint .ht{color:#3a6aa8;margin-bottom:.25em}
.needhint ul{margin:0;padding-left:1.2em;display:grid;grid-template-columns:1fr 1fr;column-gap:1.2em;line-height:1.5}
.needhint .hn{color:var(--soft);font-size:.9em;margin-top:.2em}
.quote{background:#fff1d6;border-radius:.8em;padding:.4em .9em;margin-top:.5em;font-size:.92em}
textarea{width:100%;font-size:1em;font-family:inherit;border:.2em solid #e2d5bd;border-radius:.8em;padding:.4em .6em;margin-top:.5em;resize:none}
/* 角色設定 */
.setup{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
.scard{display:flex;gap:.6em;align-items:center;background:#fff;border:.18em solid #ecdcbc;border-radius:1em;padding:.55em .6em}
.sface{flex:none;width:5.2em;height:5.2em;border-radius:.8em;background:linear-gradient(#fff6e4,#f3e2c4);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.sface img{width:112%}.sface .e{font-size:3.5em}
.sform{flex:1;min-width:0}
.slabel{color:var(--wood);margin-bottom:.2em;white-space:nowrap;font-size:.95em}.slabel span{color:var(--soft);font-size:.78em}
.sform input{width:100%;font-family:inherit;font-size:1.1em;border:.18em solid #e2d5bd;border-radius:.6em;padding:.25em .5em;-webkit-user-select:text;user-select:text;color:var(--ink)}
.sform input:focus{outline:none;border-color:var(--accent)}
.sg{display:flex;gap:.4em;margin-top:.4em}
.sg button,.chip{white-space:nowrap;font-family:inherit;border:.15em solid #e2d5bd;background:#fff;border-radius:2em;padding:.15em .9em;cursor:pointer;color:var(--ink);font-size:.95em}
.sg button.on{background:var(--accent);border-color:#c47f22;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:.3em;margin-top:.4em}.chip{font-size:.8em;padding:.1em .6em;background:#fff8ea}
.snote{margin-top:.6em;text-align:center;color:#b0702e;font-size:.95em}
/* 旅程摘要（欣賞式稱讚） */
.praise{display:grid;grid-template-columns:1fr 1fr;gap:.55em}
.pcard{display:flex;gap:.6em;align-items:flex-start;background:#fff;border:.15em solid #ecdcbc;border-radius:.9em;padding:.55em .7em;animation:rise .4s ease both}
.pcard:nth-child(2){animation-delay:.12s}.pcard:nth-child(3){animation-delay:.24s}.pcard:nth-child(4){animation-delay:.36s}.pcard:nth-child(5){animation-delay:.48s}.pcard:nth-child(6){animation-delay:.6s}
.pcard .pic{flex:none;font-size:1.7em;line-height:1}.pcard .pic .ico{width:1.2em;height:1.2em}
.pt{color:var(--wood);font-size:1em;margin-bottom:.15em}.pw{font-size:.85em;line-height:1.5}
.pledge{margin:.2em 0 .8em;background:#fff6c8;border:.15em dashed #e0b84a;border-radius:.6em;padding:.6em 1em;transform:rotate(-.6deg);text-align:center}
.pl1{color:#b0702e;font-size:.9em}.pl2{font-size:1.15em;margin:.2em 0}.pl3{font-size:.8em;color:var(--soft)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.sum .box{background:#fff;border-radius:.8em;padding:.4em .8em}
.sum .full{grid-column:1/-1}
.sum h3{margin:0;font-size:.8em;color:var(--soft)}

/* 回饋：和對話框同一種木框樣式，出現在對話框的位置 */
#fb{position:absolute;inset:0;background:rgba(40,30,30,.18);display:none;align-items:flex-end;justify-content:center;z-index:20}
#fb.on{display:flex}
#fb .in{position:relative;background:var(--paper);border:.25em solid var(--wood);border-radius:1.2em;width:52%;margin-bottom:2.2%;
  padding:1.1em 1.3em .8em;box-shadow:0 .35em 0 rgba(0,0,0,.35);animation:rise .25s ease}
#fb .tag{position:absolute;top:-1.15em;left:1em;color:#fff;padding:.05em .8em;border-radius:.6em;border:.15em solid var(--wood);font-size:.9em}
#fb p{font-size:1.1em;line-height:1.55;margin:0 0 .5em}
#fb .row{justify-content:flex-end;margin-top:0}
@keyframes rise{from{transform:translateY(1em);opacity:0}}

/* 呼吸 */
#breath{position:absolute;inset:0;background:rgba(30,40,70,.62);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:15;color:#fff}
#breath.on{display:flex}
.bwrap{position:relative;width:17em;height:15em;display:flex;align-items:flex-end;justify-content:center}
#circle{position:absolute;left:50%;top:50%;width:10em;height:10em;margin:-5em 0 0 -5em;border-radius:50%;
  background:radial-gradient(circle,rgba(216,239,255,.85),rgba(79,143,217,.35) 70%,rgba(79,143,217,0));transition:transform 3s ease-in-out}
#circle.big{transform:scale(1.6)}
#bface{position:relative;width:13em;height:13em;transition:transform 3s ease-in-out;transform-origin:50% 100%}
#bface img{width:100%;height:100%;object-fit:contain;object-position:bottom}
#bface .e{font-size:7em;text-align:center}
#bface.in{transform:scale(1.07) translateY(-2%)}
#bstep{margin-top:.6em;background:var(--paper);color:var(--ink);border:.2em solid var(--wood);border-radius:2em;padding:.1em 1.4em;font-size:1.3em;min-width:6em;text-align:center}
#bcnt{margin-top:.4em;font-size:1em}
/* 轉場卡（回憶、回到現在、時光倒流） */
#memo{position:absolute;inset:0;z-index:28;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff3dc;transition:opacity .5s}
#memo.on{display:flex}
#memo.sepia{background:radial-gradient(ellipse at center,rgba(130,92,55,.94),rgba(40,25,15,.98))}
#memo.bright{background:radial-gradient(ellipse at center,rgba(255,248,234,.96),rgba(242,214,160,.98));color:var(--ink)}
#memo .m1{font-size:1.7em;letter-spacing:.15em;opacity:0;transition:opacity .6s}
#memo .mface{width:12em;height:12em;opacity:0;transform:translateX(3em);transition:all .7s}
#memo .mface img{width:100%;height:100%;object-fit:contain}
#memo .mface .e{font-size:7em;text-align:center}
#memo .m2{font-size:1.5em;opacity:0;transition:opacity .6s;background:rgba(0,0,0,.25);padding:.1em 1.2em;border-radius:2em}
#memo.bright .m2{background:var(--wood2);color:#fff}
#memo .show{opacity:1;transform:none}
@keyframes spin{to{transform:rotate(-360deg)}}
#memo .spin{display:inline-block;animation:spin 1.2s linear infinite}

/* 標題 */
/* 標題畫面 */
.tribbon{position:relative;z-index:2;background:#e2735a;color:#fff;padding:.2em 1.6em;border-radius:.4em;font-size:1em;letter-spacing:.12em;
  box-shadow:0 .2em 0 #a8483a;margin-bottom:-.7em}
.tribbon::before,.tribbon::after{content:"";position:absolute;top:.3em;width:1em;height:100%;background:#c85a45;z-index:-1}
.tribbon::before{left:-.7em;transform:skewY(20deg)}
.tribbon::after{right:-.7em;transform:skewY(-20deg)}
.tboard{display:flex;align-items:flex-end;gap:.4em}
.tcenter{position:relative;z-index:1;background:linear-gradient(#d69c66,#b07743);border:.3em solid #6b4226;border-radius:1.2em;padding:1.1em 2.2em .9em;text-align:center;
  box-shadow:0 .45em 0 #4a2c18,inset 0 .25em 0 rgba(255,255,255,.25)}
.tcenter::before,.tcenter::after{content:"";position:absolute;top:.6em;width:.55em;height:.55em;border-radius:50%;background:#6b4226;box-shadow:inset .1em .1em 0 rgba(255,255,255,.3)}
.tcenter::before{left:.7em}.tcenter::after{right:.7em}
.tp{width:10em;height:10em;filter:drop-shadow(0 .3em .2em rgba(0,0,0,.25))}
.tp img{width:100%;height:100%;object-fit:contain;object-position:bottom}
#tpl{transform:translateX(1.2em)}#tpr{transform:translateX(-1.2em)}
.tsteps{display:flex;align-items:center;gap:.4em;margin:1em 0 .8em}
.tsteps span{background:var(--paper);border:.18em solid var(--wood);border-radius:2em;padding:.15em .9em .15em .3em;font-size:1em}
.tsteps b{display:inline-block;width:1.4em;height:1.4em;line-height:1.4em;text-align:center;border-radius:50%;background:var(--accent);color:#fff;margin-right:.35em;font-weight:400}
.tsteps i{color:var(--wood);font-style:normal;font-size:1.2em}
.btn.big{font-size:1.35em;padding:.4em 2.2em}
.tmeta{margin-top:.7em;color:var(--wood);font-size:.9em}
.tdeco{position:absolute;inset:0;pointer-events:none}
.tdeco span{position:absolute;font-size:1.8em;animation:float 3.2s ease-in-out infinite;opacity:.9}
.tdeco .ico{width:1.4em;height:1.4em}
@keyframes float{50%{transform:translateY(-.4em) rotate(8deg)}}
/* 海報範例 */
.pwrap{display:flex;gap:1.4em;align-items:flex-start;justify-content:center}
.poster{position:relative;flex:0 0 46%;background:#fffdf5;border:.12em solid #e8dcc4;border-radius:.3em;padding:.8em 1.1em .5em;transform:rotate(-1.5deg);
  box-shadow:0 .3em .6em rgba(0,0,0,.18)}
.tape{position:absolute;width:3.5em;height:1.1em;background:rgba(242,214,140,.75);top:-.5em}
.tape.t1{left:-.6em;transform:rotate(-25deg)}.tape.t2{right:-.6em;transform:rotate(25deg)}
.ptitle{font-size:1.1em;color:#d9534f;text-align:center;border-bottom:.15em dashed #f2a33a;padding-bottom:.3em;margin-bottom:.4em}
.poster ol{margin:.2em 0 .4em 1.3em;padding:0;font-size:.85em;line-height:1.45}
.poster ol li:nth-child(1){color:#3a78b8}.poster ol li:nth-child(2){color:#3fae6a}.poster ol li:nth-child(3){color:#b0702e}

/* ---------- 音效 ---------- */
let muted = false, ac;
function tone(fs, dur = .12, type = "sine", gap = .09, vol = .16) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    fs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    });
  } catch (e) {}
}
/* ---------- 背景音樂 ----------
   旋律為本遊戲原創，由瀏覽器即時合成，不使用任何現成歌曲。
   每格是一個八分音符；"." 代表休息。和弦每小節一個。 */
const 背景音樂 = {
  音量: 0.07,   // 0 ～ 0.2，數字越大越大聲
  教室: { 速度: 96, 和弦: ["C", "Am", "F", "G", "C", "Am", "F", "G"], 旋律: [
    "E5 . G5 . C6 . G5 .", "A5 . G5 E5 . . C5 .", "F5 . A5 . C6 . A5 .", "G5 . . F5 E5 . D5 .",
    "E5 . G5 . C6 . E6 .", "D6 . C6 A5 . . E5 .", "F5 . A5 G5 F5 . E5 D5", "C5 . E5 . C5 . . ."] },
  回憶: { 速度: 70, 和弦: ["Am", "F", "C", "G", "Am", "F", "Dm", "E"], 旋律: [
    "A4 . . C5 E5 . . .", "F5 . E5 . C5 . . .", "E5 . . G5 . . E5 .", "D5 . . . B4 . . .",
    "A4 . C5 . E5 . A5 .", "G5 . F5 . . . C5 .", "D5 . . F5 . . A4 .", "G#4 . . . . . . ."] },
  呼吸: { 速度: 60, 和弦: ["C", "Am", "F", "C"], 旋律: [". . . . . . . .", ". . . . . . . .", ". . . . . . . .", ". . . . . . . ."] },
};
const CHORD = { C: ["C3", "E3", "G3"], Am: ["A2", "C3", "E3"], F: ["F2", "A2", "C3"], G: ["G2", "B2", "D3"], Dm: ["D3", "F3", "A3"], E: ["E3", "G#3", "B3"] };
const NOTE_I = { C: 0, "C#": 1, D: 2, "D#": 3, E: 4, F: 5, "F#": 6, G: 7, "G#": 8, A: 9, "A#": 10, B: 11 };
const n2f = n => { const m = n.match(/^([A-G]#?)(\d)$/); return 440 * Math.pow(2, (NOTE_I[m[1]] + (+m[2] + 1) * 12 - 69) / 12); };
const bgm = { mode: null, gain: null, timer: null, step: 0, next: 0 };
function bgmInit() {
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  if (!bgm.gain) { bgm.gain = ac.createGain(); bgm.gain.gain.value = 0; bgm.gain.connect(ac.destination); }
}
function bgmNote(f, t, dur, type, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (type === "sine" && dur > 1 ? .4 : .01));
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(bgm.gain); o.start(t); o.stop(t + dur + .05);
}
function bgmTick() {
  const S = 背景音樂[bgm.mode]; if (!S) return;
  const eighth = 60 / S.速度 / 2, bars = S.旋律.map(b => b.split(" "));
  while (bgm.next < ac.currentTime + .3) {
    const bar = Math.floor(bgm.step / 8) % bars.length, i = bgm.step % 8, t = bgm.next;
    const n = bars[bar][i];
    if (n && n !== ".") {      // 音樂盒：主音加一點高八度泛音
      const f = n2f(n), soft = bgm.mode === "回憶";
      bgmNote(f, t, soft ? 1.4 : .9, "sine", soft ? .5 : .6);
      bgmNote(f * 2, t, .35, "triangle", soft ? .05 : .09);
    }
    if (i === 0) {             // 每小節：柔和和聲＋低音
      const c = CHORD[S.和弦[bar % S.和弦.length]], barLen = eighth * 8;
      c.forEach(x => bgmNote(n2f(x) * 2, t, barLen * .95, "sine", .12));
      bgmNote(n2f(c[0]), t, barLen * .45, "triangle", .22);
    }
    if (i === 4 && bgm.mode !== "呼吸") bgmNote(n2f(CHORD[S.和弦[bar % S.和弦.length]][0]), t, eighth * 3.5, "triangle", .16);
    bgm.next += eighth; bgm.step++;
  }
}
function setMusic(mode) {
  try {
    bgmInit();
    if (ac.state === "suspended") ac.resume();
    if (bgm.mode === mode) return;
    const now = ac.currentTime, target = muted ? 0 : 背景音樂.音量;
    bgm.gain.gain.cancelScheduledValues(now);
    bgm.gain.gain.setValueAtTime(bgm.gain.gain.value, now);
    bgm.gain.gain.linearRampToValueAtTime(0, now + .6);       // 淡出舊的
    setTimeout(() => {
      bgm.mode = mode; bgm.step = 0; bgm.next = ac.currentTime + .05;
      const t = ac.currentTime;
      bgm.gain.gain.cancelScheduledValues(t); bgm.gain.gain.setValueAtTime(0, t);
      bgm.gain.gain.linearRampToValueAtTime(muted ? 0 : 背景音樂.音量, t + 1.2);   // 淡入新的
      if (!bgm.timer) bgm.timer = setInterval(bgmTick, 100);
    }, 650);
  } catch (e) {}
}
function applyMute() { if (bgm.gain && ac) { const t = ac.currentTime; bgm.gain.gain.cancelScheduledValues(t); bgm.gain.gain.setTargetAtTime(muted ? 0 : 背景音樂.音量, t, .15); } }

  view.z = z; view.vx = clamp(cam.x - vw / 2, 0, W - vw); view.vy = clamp(cam.y - vh * fy, 0, H - vh);
}

/* ---------- 繪製迴圈 ---------- */
let last = performance.now();
function loop(now) {
  // 平板效能較差時也維持正常走路速度：把時間切成小段更新
  const frameDt = Math.min(.5, (now - last) / 1000); let rest = frameDt; last = now;
  while (rest > 0) { const s = Math.min(rest, .033); update(s); rest -= s; }
  if (zone && control && player && zone.test(player)) { const z = zone; zone = null; player.tx = player.ty = null; player.path = null; z.r(); }
  checkQuest();
  updateCam(frameDt);
  const k = SCALE * view.z;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(k, 0, 0, k, -view.vx * k, -view.vy * k); ctx.imageSmoothingEnabled = false;
  if (IMG.map) { ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high"; ctx.drawImage(IMG.map, 0, 0, W, H); ctx.imageSmoothingEnabled = false; }
  else ctx.drawImage(mapCanvas, 0, 0);
  if (marker && now - marker.t < 600) { const k = (now - marker.t) / 600; ctx.strokeStyle = `rgba(242,163,58,${1 - k})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(marker.x, marker.y, 6 + k * 8, 3 + k * 4, 0, 0, 7); ctx.stroke(); }
  if (guide) {
    // 目標提示：腳下閃動的光環＋白底深框的箭頭，在木頭色背景上也看得清楚
    const g = typeof guide === "function" ? guide() : guide, b = Math.sin(now / 200) * 3, k = (now % 1200) / 1200;
    ctx.lineWidth = 2; ctx.strokeStyle = `rgba(255,255,255,${.9 - k * .8})`;
    ctx.beginPath(); ctx.ellipse(g.x, g.y, 8 + k * 10, 3.5 + k * 4.5, 0, 0, 7); ctx.stroke();
    ctx.strokeStyle = "rgba(255,214,90,.9)"; ctx.beginPath(); ctx.ellipse(g.x, g.y, 9, 4, 0, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(g.x - 9, g.y - 70 + b); ctx.lineTo(g.x + 9, g.y - 70 + b); ctx.lineTo(g.x, g.y - 57 + b); ctx.closePath();
    ctx.lineJoin = "round"; ctx.lineWidth = 3.5; ctx.strokeStyle = "#2b1f1a"; ctx.stroke();
    ctx.fillStyle = "#fffdf5"; ctx.fill();
    ctx.lineWidth = 1.2; ctx.strokeStyle = "#f2a33a"; ctx.stroke();
  }
  const all = [...Object.values(E), ...EXTRA].filter(e => e.visible).sort((a, b) => a.y - b.y);
  npcIdle(now);
  all.forEach(e => drawSprite(ctx, e, now));
  if (player && control) { ctx.fillStyle = "#f2a33a"; ctx.beginPath(); ctx.moveTo(player.x - 4, player.y - 50); ctx.lineTo(player.x + 4, player.y - 50); ctx.lineTo(player.x, player.y - 45); ctx.fill(); }
  all.forEach(e => drawEmote(ctx, e));
  requestAnimationFrame(loop);
}

const near = (a, b, d) => Math.hypot(a.x - b.x, a.y - b.y) < d;
const nearT2 = p => p.x > 336 && p.x < 545 && p.y > 92 && p.y < 228;

async function play() {
  // 開場
  stageName("開場");
  E.小明.dir = "up";
  await talk(台詞.開場); endTalk();
  await posterPanel();
  await talk(台詞.開場_海報後); endTalk();
  // 第 1 關：自由走到阿杰那一組
  stageName("第 1 關｜小明的角度");
  player = E.小明; questsOn = true; paintStars(); markQuests();
  control = true; guide = () => E.阿杰; hint(台詞.開場提示); patrol();
  await waitZone(nearT2);
  questsOn = false; activeQuests(); 台詞.支線.forEach(q => { if (!q.done) EXTRA[q.對象].emote = null; });
  control = false; guide = null; hint(""); player.solid = false; stopPatrol();
  camFocus(E.小明, E.小華);
  face(E.小明, E.小華); face(E.小華, E.小明); emote(E.阿杰, "♪");
  const L1 = 台詞.第一關;
  await say(...L1[0]);
  emote(E.小華, "急！"); await say(...L1[1]);
  E.小華.dir = "right"; await say(...L1[2]);
  emote(E.組員1, "嘻嘻", 2500); emote(E.組員2, "嘻嘻", 2500); await say(...L1[3]);

  endTalk();
  S.mingFeel = await cardTask(任務.小明感受, "小明");
  // 性別小問題
  const g = CFG.p.g === "女" ? 任務.性別_女 : 任務.性別;
  await say("小明", g.表情 || "難過", g.心裡話);
  const gi = await ask("想一想", g.題目, g.選項, o => o[0]);
  S.gender = g.選項[gi][0]; gi === 0 ? sfx.good() : sfx.hmm();

  S.mingTemp = await thermoTask();
  const ni = await listTask(任務.小明需求.題目, 任務.小明需求.選項, 任務.需求提示); S.mingNeed = 任務.小明需求.選項[ni];
  sfx.good(); await feedback("info", 任務.小明需求.回饋); closeSheet();

  // 轉場：換個位置
  await transitionCard({ style: "sepia", top: `<span class="spin">⟲</span> ${esc(台詞.回憶轉場[0])}`, who: "小華", expr: "平常", bottom: 台詞.回憶轉場[1], hold: 2400, mid: () => {
    stage.classList.add("memory"); camReset(); setMusic("回憶");
    Object.assign(E.小明, { x: POS.小明門口[0], y: POS.小明門口[1], dir: "right" }); Object.assign(E.小華, { x: POS.小華座位[0], y: POS.小華座位[1], dir: "right" });
    Object.assign(E.老師, { x: POS.老師[0], y: POS.老師[1], dir: "down", tx: null, ty: null });
    stageName("第 2 關｜換個位置");
  } });
  // 第 2 關：操控小華去找老師
  camReset(); player = E.小華; control = true; guide = () => E.老師; hint(台詞.第二關提示);
  await waitZone(p => near(p, E.老師, 58));
  control = false; guide = null; hint(""); player.solid = false;
  camFocus(E.小華, E.老師); face(E.小華, E.老師); face(E.老師, E.小華);
  await talk(台詞.第二關_老師); endTalk(); camFocus(E.小華);
  await walkPath(E.小華, [[E.小華.x, 140], [379, 140], [379, 162]]);
  E.小華.dir = "right";
  // 小明從門口走過來
  await walkPath(E.小明, [[90, 342], [320, 342], [320, 200], [350, 182]]);
  camFocus(E.小明, E.小華); face(E.小明, E.小華); face(E.小華, E.小明);

  await say(...L2[0]); emote(E.小華, "急！"); await say(...L2[1]); await say(...L2[2]); endTalk();
  S.huaFeel = await cardTask(任務.小華感受, "小華");
  const hi = await listTask(任務.小華需求.題目, 任務.小華需求.選項, 任務.需求提示); S.huaNeed = 任務.小華需求.選項[hi];
  sfx.good(); await feedback("good", 任務.小華需求.回饋); closeSheet();
  await ahaPanel();

  // 第 3 關
  await transitionCard({ style: "bright", top: esc(台詞.回到現在[0]), who: "小明", expr: "尷尬", bottom: 台詞.回到現在[1], hold: 1800, mid: () => {
    stage.classList.remove("memory"); setMusic("教室");
    Object.assign(E.小明, { x: 300, y: 214, dir: "right" }); Object.assign(E.小華, { x: POS.小華座位[0], y: POS.小華座位[1], dir: "left" });
    camFocus(E.小明, E.小華); S.m = S.mingTemp; S.h = 3; S.fr = 2; $("hud").classList.add("on"); stage.classList.add("hudon"); paintHUD();
    stageName("第 3 關｜停、想、說、找");
  } });
  await talk(台詞.第三關開場);

  // 3-1 做法
  await chooseLoop(任務.做法, async o => { if (o.台詞) { emote(E.小明, o.小明 > 0 ? "哼！" : "…"); await say(...o.台詞); } });
  endTalk();
  await breathe();
  // 走過去
  camReset(); player = E.小明; control = true; guide = () => E.小華; hint(台詞.走過去提示); patrol();
  await waitZone(p => near(p, E.小華, 52));
  control = false; guide = null; hint(""); player.solid = false; stopPatrol();
  camFocus(E.小明, E.小華); face(E.小明, E.小華); face(E.小華, E.小明);
  // 3-2 開口
  await chooseLoop(任務.開口, async o => { await say(...o.台詞); });
  emote(E.小華, "!"); await say(...台詞.小華回應);
  // 3-3 辦法
  const sol = await chooseLoop(任務.辦法, null);
  endTalk(); S.ending = sol.結局;
  if (sol.結局 === "問老師") {
    await stopPatrol(); camFocus(E.小明, E.小華, E.老師);
    walkPath(E.小華, [[E.小華.x, 140], [318, 142]]);
    await walkPath(E.小明, [[E.小明.x, 196], [284, 196], [284, 142]]);
    await sleep(300); face(E.小明, E.老師); face(E.小華, E.老師); face(E.老師, E.小明);
    await talk(台詞.結局_問老師);
    emote(E.小明, "♪"); emote(E.小華, "♪"); emote(E.阿杰, "耶！");
  } else {
    camFocus(E.小明, EXTRA[8]);
    await walkPath(E.小明, [[320, E.小明.y], [320, 268], [372, 268]]); E.小明.dir = "right";
    emote(EXTRA[8], "歡迎！"); emote(EXTRA[9], "♪");
    await talk(台詞.結局_別組);
  }
  endTalk(); await sleep(600);
  // 3-4 換你當組長
  await transitionCard({ style: "sepia", top: `<span class="spin">⟲</span> ${esc(台詞.時光倒流轉場[0])}`, who: "小華", expr: "平常", bottom: 台詞.時光倒流轉場[1], hold: 1400, mid: () => { stage.classList.add("memory"); setMusic("回憶"); } });
  const cfg = 任務.換你當組長; camFocus(E.小華);
  for (;;) {
    setPortrait("pr", "小華", "平常");
    const i = await ask("換你當組長", cfg.題目, cfg.選項);
    const o = cfg.選項[i];
    if (o.好) { S.leaderOk = true; setPortrait("pr", "小華", "微笑"); sfx.badge(); await feedback("good", o.回饋); break; }
    sfx.hmm();
    if (await perspective(o)) continue;
    S.kept.push(o.字); await talk(o.後果); break;
  }
  endTalk(); stage.classList.remove("memory"); setMusic("教室");
  camReset(); await reflectPanel();
  stageName("我的旅程");
  summaryPanel();
}

/* 完成小任務：星星從畫面中央跳出來，再飛進上方的「善意星星」計數 */
async function starFly() {
  const st = stage.getBoundingClientRect(), f = document.createElement("div");
  f.className = "flystar"; f.style.left = "50%"; f.style.top = "42%";
  f.innerHTML = `<div class="big">${icon("星星") || "★"}</div><div class="cap">+1 善意星星</div>`;
  stage.appendChild(f);
  await sleep(30); f.classList.add("show"); sfx.badge();
  for (let i = 0; i < 10; i++) {   // 四周散開的小光點
    const sp = document.createElement("div"), a = i / 10 * Math.PI * 2;
    sp.className = "spark"; sp.style.left = "50%"; sp.style.top = "42%"; stage.appendChild(sp);
    requestAnimationFrame(() => { sp.style.transform = `translate(${Math.cos(a) * 7}em,${Math.sin(a) * 5}em)`; sp.style.opacity = 0; });
    setTimeout(() => sp.remove(), 700);
  }
  await sleep(1100);
  const t = $("stars").getBoundingClientRect();
  f.classList.add("fly");
  f.style.left = ((t.left + t.width * .18 - st.left) / st.width * 100) + "%";
  f.style.top = ((t.top + t.height / 2 - st.top) / st.height * 100) + "%";
  f.style.transform = "translate(-50%,-50%) scale(.18)"; f.style.opacity = .3;
  await sleep(700); f.remove();
  tone([1046, 1318], .12, "sine", .07);
  $("stars").classList.remove("pulse"); void $("stars").offsetWidth; $("stars").classList.add("pulse");
}

/* 選了不好的回應：先看見對方的反應 → 換位思考 → 讓學生自己決定要不要換個做法（回傳 true 代表想換） */
async function perspective(o) {
  if (o.反應) await say(...o.反應);
  const P = o.換位;
  if (P) {
    const fi = await ask("換位思考", P.問題, P.感受);
    await feedback("info", `換成是${P.對象}，可能會覺得「${P.感受[fi]}」。${o.回饋 || ""}`);
  }
  const d = await ask("你的決定", "知道對方的感受之後，你想怎麼做？", ["換個做法試試看", "我還是決定這樣做"]);
  return d === 0;
}

async function chooseLoop(cfg, onPick) {
  for (;;) {
    const snap = { m: S.m, h: S.h, fr: S.fr };
    setPortrait("pl", "小明", S.m >= 4 ? "難過" : S.m === 3 ? "尷尬" : "平靜");
    const i = await ask(cfg.步驟, cfg.題目, cfg.選項);
    const o = cfg.選項[i];
    S.tried.add(o.字);
    if (onPick) await onPick(o);
    S.m = clamp(S.m + (o.小明 || 0), 1, 5); S.h = clamp(S.h + (o.小華 || 0), 1, 5); S.fr = clamp(S.fr + (o.友誼 || 0), 0, 5);
    paintHUD();
    if (o.重來) {
      sfx.hmm();
      if (await perspective(o)) { Object.assign(S, snap); paintHUD(); continue; }
      S.kept.push(o.字);                 // 學生堅持原本的選擇：保留後果，劇情繼續
      if (o.後果) await talk(o.後果);
      if (o.繼續) continue;              // 還沒找到辦法：老師引導後再想一次
      return o;
    }
    (o.徽章 || []).forEach(b => S.badges.add(b)); paintHUD(); sfx.badge();
    await feedback("good", o.回饋);
    return o;
  }
}

/* ---------- 角色設定畫面 ---------- */
function applyGender() {
  const swap = (who, girl) => {
    if (IMG[`girl_${who}`]) IMG[who] = IMG[`girl_${who}`];
    for (const n of [1, 2, 3, 4, 5, 6]) if (IMG[`p_${girl}_${n}`]) IMG[`p_${who}_${n}`] = IMG[`p_${girl}_${n}`];
  };
  if (CFG.p.g === "女") swap("小明", "主角女");
  if (CFG.f.g === "女") swap("小華", "組長女");
  LOOK.小明.style = CFG.p.g === "女" ? "bob" : "short";
  LOOK.小華.style = CFG.f.g === "女" ? "pony" : "bangs";
}

      </div>
      <div class="snote">${esc(C.提醒)}</div>

    s.classList.add("on"); s.scrollTop = 0;

    paint();

      sfx.tap(); CFG[grp.dataset.who].g = b.dataset.g;

    s.querySelectorAll(".chip").forEach(c => c.onclick = () => { sfx.tap(); $("nf").value = c.textContent; });

      sfx.good(); applyGender(); closeSheet(); res();
    };
  });
}
